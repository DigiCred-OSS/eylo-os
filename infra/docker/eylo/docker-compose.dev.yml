name: eylo

x-eylo-development-environment: &eylo-development-environment
  ENV: local
  DB_USER: eylo
  DB_PASSWORD: eylo
  DB_NAME: eylo
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-local-development-secret-change-me}
  AUTH_ALGORITHM: HS256
  AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  REDIS_PASSWORD: ""
  API_BASE_URL: http://127.0.0.1:8000/api
  OAUTH_CALLBACK_URL: http://localhost:8000/api/oauth/callback
  FRONTEND_URL: http://127.0.0.1:5173
  WIDGET_URL: http://127.0.0.1:5174
  CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:5174","http://localhost:8000","http://127.0.0.1:5173","http://127.0.0.1:5174"]'

x-eylo-development-env-file: &eylo-development-env-file
  - path: ../../../server/eylo/common/config/.env.docker
    required: true

services:
  eylo-server:
    environment: *eylo-development-environment
    env_file: *eylo-development-env-file
    ports:
      - name: api
        target: 8000
        published: "${EYLO_API_PORT:-8000}"
        host_ip: 127.0.0.1
        protocol: tcp

  worker:
    environment: *eylo-development-environment
    env_file: *eylo-development-env-file

  postgres-17:
    environment:
      POSTGRES_DB: eylo
      POSTGRES_USER: eylo
      POSTGRES_PASSWORD: eylo
